; Applies to this directory and everything under it (PHP re-reads .user.ini
; files automatically — no Apache/server restart needed, though PHP caches
; it for user_ini.cache_ttl seconds, 300 by default).
;
; session.cookie_secure is deliberately NOT set here. Forcing it to 1 would
; stop the session cookie being sent at all over plain HTTP, which breaks
; login on a local XAMPP setup (http://localhost/...). Once this site is
; actually served over HTTPS, add:
;   session.cookie_secure = 1
; either here or in the real server config for that environment.

session.cookie_httponly = 1
session.cookie_samesite = Lax

; Local/dev: warnings and errors were printing straight into the page
; (e.g. the "Undefined array key" warning that showed a full
; C:\xampp\htdocs\... file path). Log them instead of displaying them.
display_errors = Off
display_startup_errors = Off
log_errors = On

; Cooking Tutorials / Educational Videos can now accept an uploaded MP4
; or WEBM file (see includes/upload.php's UPLOAD_VIDEO_MAX_BYTES, 50 MB)
; as an alternative to a YouTube link. Both of PHP's own limits below
; must be raised past that app-level cap, or a file under 50 MB would
; still get silently truncated/rejected at the PHP level before the app
; ever sees it. post_max_size stays a little above upload_max_filesize
; to leave room for the rest of the form (title, description, token).
upload_max_filesize = 55M
post_max_size = 60M
