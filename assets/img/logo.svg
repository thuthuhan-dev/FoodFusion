<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="FoodFusion logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>FoodFusion</title>
  <!-- Rounded tile background -->
  <rect width="64" height="64" rx="16" fill="#1F5A3D"/>

  <!-- Steam rising from the lid -->
  <g stroke="#E8C46A" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M25 15c-1.8-2 1.8-3.6 0-5.6"/>
    <path d="M32 12.6c-1.8-2 1.8-3.6 0-5.6"/>
    <path d="M39 15c-1.8-2 1.8-3.6 0-5.6"/>
  </g>

  <!-- Lid knob -->
  <circle cx="32" cy="21" r="2.7" fill="#E8C46A"/>

  <!-- Conical tagine lid -->
  <path d="M15 40 Q19.5 30.5 29.8 23.4 Q32 21.9 34.2 23.4 Q44.5 30.5 49 40 Z"
        fill="#FFFDF8"/>
  <path d="M15 40 Q19.5 30.5 29.8 23.4 Q32 21.9 34.2 23.4 Q44.5 30.5 49 40"
        fill="none" stroke="#E8C46A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Decorative band across the lid -->
  <path d="M22.5 35h19" stroke="#1F5A3D" stroke-width="2.2" stroke-linecap="round" opacity="0.35"/>

  <!-- Base dish -->
  <rect x="12" y="40.3" width="40" height="7.4" rx="2.6" fill="#E8C46A"/>
  <path d="M18 47.6h28" stroke="#1F5A3D" stroke-width="2" stroke-linecap="round" opacity="0.25"/>
</svg>
